name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          test -n "$udid" && test "$udid" != "null"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # Release is where the optimizer surfaces its own warnings; both
      # configurations must stay warning-free.
      - name: Build Release
        run: |
          xcodebuild build \
            -project Bittern.xcodeproj -scheme Bittern -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # Xcode can hang while symbolicating a failed test, so the step has its
      # own timeout rather than relying on xcodebuild to exit.
      - name: Test Debug
        timeout-minutes: 30
        run: |
          xcodebuild test \
            -project Bittern.xcodeproj -scheme Bittern -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tests.xcresult
          path: build/Tests.xcresult
          if-no-files-found: ignore
