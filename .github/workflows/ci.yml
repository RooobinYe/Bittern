name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Bittern.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Release is where the optimizer surfaces its own warnings; both
      # configurations must stay warning-free. SWIFT_TREAT_WARNINGS_AS_ERRORS
      # is configured on the Bittern and BitternTests targets rather than the
      # command line so remote SPM packages keep Xcode's -suppress-warnings.
      # Build arm64 only and skip dSYM and index generation since this job only
      # verifies compilation.
      - name: Build Release
        run: |
          xcodebuild build \
            -project Bittern.xcodeproj -scheme Bittern -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

  test-debug:
    name: Test Debug
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The newest iOS runtime, since older ones can be below the deployment
      # target and xcodebuild then finds no matching destination. Kick off
      # booting immediately so it overlaps with compiling the test bundle.
      - name: Pick and boot an iPhone simulator
        run: |
          runtime="$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          echo "Runtime: $runtime"
          udid="$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" '
              [.devices[$runtime][]? | select(.name | startswith("iPhone"))]
              | (map(select(.name == "iPhone 18 Pro")) + map(select(.state == "Booted")) + .)
              | first | .udid')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator for $runtime"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          state="$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" --arg udid "$udid" '.devices[$runtime][]? | select(.udid == $udid) | .state')"
          if [ "$state" != "Booted" ]; then
            nohup xcrun simctl boot "$udid" </dev/null >/dev/null 2>&1 &
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Bittern.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Build against the generic simulator destination so xcodebuild does not
      # block on CoreSimulator while the chosen device is booting in parallel.
      - name: Build Debug for testing
        run: |
          xcodebuild build-for-testing \
            -project Bittern.xcodeproj -scheme Bittern -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator boot
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b -d

      # Xcode can hang while symbolicating a failed test, so the step has its
      # own timeout rather than relying on xcodebuild to exit.
      - name: Run Debug tests
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building \
            -project Bittern.xcodeproj -scheme Bittern -configuration Debug \
            -destination "platform=iOS Simulator,arch=arm64,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            -parallel-testing-enabled NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Tests.xcresult
          path: build/Tests.xcresult
          if-no-files-found: ignore
