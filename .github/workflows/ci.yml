name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The newest iOS runtime, since older ones can be below the deployment
      # target and xcodebuild then finds no matching destination.
      - name: Pick an iPhone simulator
        run: |
          runtime="$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          echo "Runtime: $runtime"
          udid="$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" '[.devices[$runtime][]? | select(.name | startswith("iPhone"))] | first | .udid')"
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator for $runtime"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # Release is where the optimizer surfaces its own warnings; both
      # configurations must stay warning-free.
      - name: Build Release
        run: |
          xcodebuild build \
            -project Bittern.xcodeproj -scheme Bittern -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # Xcode can hang while symbolicating a failed test, so the step has its
      # own timeout rather than relying on xcodebuild to exit.
      - name: Test Debug
        timeout-minutes: 30
        run: |
          xcodebuild test \
            -project Bittern.xcodeproj -scheme Bittern -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tests.xcresult
          path: build/Tests.xcresult
          if-no-files-found: ignore
