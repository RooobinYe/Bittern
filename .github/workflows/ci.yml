name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Bittern.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Release is where the optimizer surfaces its own warnings; both
      # configurations must stay warning-free. SWIFT_TREAT_WARNINGS_AS_ERRORS
      # is configured on the Bittern and BitternTests targets rather than the
      # command line so remote SPM packages keep Xcode's -suppress-warnings.
      # Build arm64 only and skip dSYM and index generation since this job only
      # verifies compilation.
      - name: Build Release
        run: |
          xcodebuild build \
            -project Bittern.xcodeproj -scheme Bittern -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

  build-debug-tests:
    name: Build Debug (with tests)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Bittern.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Compile both Bittern and BitternTests in Debug without booting an iOS
      # simulator (cold-booting iOS 27.2 takes 5+ minutes on the 3-core runner);
      # unit tests run locally on Mac in ~20s.
      - name: Build Debug for testing
        run: |
          xcodebuild build-for-testing \
            -project Bittern.xcodeproj -scheme Bittern -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO
